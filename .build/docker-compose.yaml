# Docker Compose configuration for the Dragonfly application.
#
# Start from the repository root:
#   docker compose -f .build/docker-compose.yaml up -d
#
# Validate configuration:
#   docker compose -f .build/docker-compose.yaml config --quiet
#
# Check container health:
#   docker compose -f .build/docker-compose.yaml ps

services:
  www:
    # Keep the familiar container name for local commands.
    container_name: www

    # Run the published Dragonfly image.
    image: docker.io/webpwnized/dragonfly:www

    # Prevent executable files from granting additional privileges.
    security_opt:
      - no-new-privileges:true

    # Limit resource consumption on the Docker host.
    # These are initial values to verify during testing.
    # Cloud Run resource limits are configured separately in Terraform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

    # Check the existing health.php endpoint using PHP itself.
    # This avoids installing curl or another utility in the slim image.
    # Require the exact response produced by the health endpoint.
    # Double dollar signs preserve PHP variables through Compose interpolation.
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - >-
          $$context = stream_context_create(['http' => ['timeout' => 2]]);
          $$body = @file_get_contents('http://127.0.0.1/health.php', false, $$context);
          exit($$body === "ok\n" ? 0 : 1);
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    ports:
      # Serve the workshop's usual local browser address.
      - "127.0.0.1:80:80"

      # Provide the existing endpoint used by DAST scanning.
      - "127.0.0.1:8888:80"

    # Attach the service to the existing HTTP network.
    networks:
      - httpnet

networks:
  httpnet: